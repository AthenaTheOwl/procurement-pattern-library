# Maps each schema to the files it governs, for
# scripts/validate_data_conformance.py. validate_schemas.py checks the
# schema files themselves; this file is what makes them constrain the
# data they describe.
version: 1
mappings:
  - schema: case.schema.json
    files: ["patterns/*/applications/*.md"]
    records: frontmatter
  - schema: pattern.schema.json
    files: ["patterns/*.md"]
    records: frontmatter
  - schema: retro.schema.json
    files: ["ledger/runs/*.md"]
    records: frontmatter
